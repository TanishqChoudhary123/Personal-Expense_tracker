<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="page-header">
      <h1>Personal Expense Tracker</h1>
      <p>Keep track of your expenses.</p>
    </header>

    <section class="topbar" aria-label="Expense summary">
      <article class="summary-card">
        <p class="eyebrow">Total spent</p>
        <h1 id="totalSpent">₹2,725.00</h1>
        <p class="caption">Your recorded expenses</p>
      </article>

      <article class="transaction-card">
        <p class="eyebrow">Transactions</p>
        <h2 id="transactionCount">4</h2>
        <p class="caption" id="expenseCount">Expenses, added</p>
      </article>
    </section>

    <section class="content">
      <form class="expense-form" id="expenseForm">
        <div class="form-heading">
          <h2>Add an expense</h2>
        </div>

        <label for="description">Expense name</label>
        <input id="description" name="description" type="text" placeholder="e.g. Groceries" required>

        <label for="amount">Amount (₹)</label>
        <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="e.g. 450" required>

        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="" disabled selected>Choose category</option>
          <option value="Education">Education</option>
          <option value="Shopping">Shopping</option>
          <option value="Food">Food</option>
          <option value="Bills">Bills</option>
          <option value="Transport">Transport</option>
          <option value="Travel">Travel</option>
          <option value="Health">Health</option>
          <option value="Other">Other</option>
        </select>

        <button class="submit-button" type="submit">Add expense <span aria-hidden="true">→</span></button>
        <p class="success" id="successMessage" role="status">Expense added successfully!</p>
      </form>

      <section class="activity">
        <div class="activity-header">
          <h2>Your activity</h2>
          <select id="categoryFilter" aria-label="Filter expenses by category">
            <option value="All">All categories</option>
            <option value="Education">Education</option>
            <option value="Shopping">Shopping</option>
            <option value="Food">Food</option>
            <option value="Bills">Bills</option>
            <option value="Transport">Transport</option>
            <option value="Travel">Travel</option>
            <option value="Health">Health</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="expense-list" id="expenseList"></div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
